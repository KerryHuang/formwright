<!doctype html>
<!-- 官網分享預覽圖（og:image）原稿：1200×630。重產：bash scripts/site/render-share-card.sh -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Formwright 分享預覽圖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=Noto+Sans+TC:wght@500;900&amp;display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #1E2A44; }
  .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 72px 88px; display: flex; flex-direction: column; justify-content: space-between; color: #FFFFFF; font-family: 'Noto Sans TC', sans-serif; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand span { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 44px; letter-spacing: -1px; }
  .brand small { font-size: 30px; font-weight: 500; color: #AEB8CC; margin-left: 6px; }
  h1 { margin: 0; font-size: 92px; font-weight: 900; line-height: 1.15; letter-spacing: 2px; }
  h1 em { font-style: normal; color: #FFD23F; }
  p { margin: 0; font-size: 34px; font-weight: 500; color: #E8EDF7; }
  .bar { display: flex; gap: 14px; }
  .bar i { display: block; height: 10px; border-radius: 5px; background: #2F80ED; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg width="72" height="72" viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="8" width="14" height="48" rx="3" fill="#FFFFFF"/><rect x="28" y="8" width="28" height="14" rx="3" fill="#FFFFFF"/><rect x="28" y="28" width="16" height="12" rx="3" fill="#FFFFFF"/><rect x="48" y="28" width="8" height="12" rx="3" fill="#2F80ED"/></svg>
    <span>Formwright<small>表匠</small></span>
  </div>
  <div>
    <h1>公司的系統，<em>自己拼</em></h1>
    <p style="margin-top: 24px">客戶管理、進銷存、生產管理．不寫程式、不等外包</p>
  </div>
  <div class="bar"><i style="width: 240px"></i><i style="width: 120px"></i><i style="width: 60px; background: #FFD23F"></i></div>
</div>
</body>
</html>
