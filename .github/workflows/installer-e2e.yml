# 一鍵安裝版的 Ubuntu 與 Docker 端到端測試（設計 AC-02～10、12、13 的 Linux／Docker 部分）。
# 建三個 0.0.1-e2e.* 版本的 tarball 與映像，在 Ubuntu 22.04、24.04 跑 install.sh（systemd 真的起），
# 在 24.04 跑 docker compose 的精靈、升級、升級前備份失敗與回復。
name: installer-e2e

on:
  push:
    branches-ignore: [main]
    paths:
      - 'installer/**'
      - 'deploy/**'
      - 'scripts/installer/**'
      - 'backend/src/DynamicModules.WebAPI/Setup/**'
      - 'backend/src/DynamicModules.WebAPI/Program.cs'
      - 'backend/src/DynamicModules.WebAPI/Ops/PreUpgradeBackup.cs'
      - 'Dockerfile'
      - '.github/workflows/installer-e2e.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # GitHub 對明指 bash 的 shell 加 -eo pipefail，管線裡失敗才不會被吞掉

env:
  V1: 0.0.1-e2e.1
  V2: 0.0.1-e2e.2
  V3: 0.0.1-e2e.3

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: 腳本檢查（shellcheck、預設值產生腳本、install.sh 離線測試）
        run: |
          shellcheck installer/linux/install.sh installer/linux/install.test.sh scripts/installer/e2e/wizard.sh
          node --test scripts/installer/render-defaults.test.mjs
          node scripts/installer/render-defaults.mjs --check
          python3 -I scripts/installer/e2e/totp_test.py
          bash installer/linux/install.test.sh
      - name: 建前端
        working-directory: frontend
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bunx quasar prepare
          APP_VERSION="$V1" bunx quasar build
          # B03：source map 移出 wwwroot（照 Dockerfile，設計 T9）：web/wwwroot 去掉 *.map，web/sourcemaps 只留 *.map
          web="$RUNNER_TEMP/web"; rm -rf "$web"; mkdir -p "$web"
          cp -r dist/spa "$web/sourcemaps" && find "$web/sourcemaps" -type f ! -name '*.map' -delete
          cp -r dist/spa "$web/wwwroot" && find "$web/wwwroot" -name '*.map' -delete
          test -z "$(find "$web/wwwroot" -name '*.map')"
      - name: 發佈三個版本的 tarball
        run: |
          mkdir -p "$RUNNER_TEMP/pkgs"
          for v in "$V1" "$V2" "$V3"; do
            out="$RUNNER_TEMP/pub-$v"
            dotnet publish backend/src/DynamicModules.WebAPI/DynamicModules.WebAPI.csproj -c Release -r linux-x64 \
              --self-contained true -p:AppVersion="$v" -o "$out"
            rm -rf "$out/wwwroot"; cp -r "$RUNNER_TEMP/web/wwwroot" "$out/wwwroot"; cp -r "$RUNNER_TEMP/web/sourcemaps" "$out/sourcemaps"
            printf '%s' "$v" > "$out/VERSION"
            tar -czf "$RUNNER_TEMP/pkgs/formwright-$v-linux-x64.tar.gz" -C "$out" .
          done
          ls -l "$RUNNER_TEMP/pkgs"
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-packages
          path: ${{ runner.temp }}/pkgs/*.tar.gz
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-wwwroot
          path: ${{ runner.temp }}/web
          retention-days: 3

  linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      W: scripts/installer/e2e/wizard.sh
      URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: e2e-packages
          path: ${{ runner.temp }}/pkgs
      - name: 前置（jq、套件路徑）
        run: |
          sudo apt-get install -y jq sqlite3 >/dev/null
          echo "P1=$RUNNER_TEMP/pkgs/formwright-$V1-linux-x64.tar.gz" >> "$GITHUB_ENV"
          echo "P2=$RUNNER_TEMP/pkgs/formwright-$V2-linux-x64.tar.gz" >> "$GITHUB_ENV"
          echo "P3=$RUNNER_TEMP/pkgs/formwright-$V3-linux-x64.tar.gz" >> "$GITHUB_ENV"

      - name: fresh-install（AC-02）
        run: |
          sudo FORMWRIGHT_PACKAGE="$P1" bash installer/linux/install.sh | tee out.txt
          test "$(systemctl is-active formwright)" = active
          test "$(systemctl is-enabled formwright)" = enabled
          test "$(stat -c %U /var/lib/formwright/data)" = formwright
          # M1：父目錄 root 擁有，服務帳號不能在裡面換 symlink
          test "$(stat -c '%U %a' /var/lib/formwright)" = 'root 755'
          test "$(stat -c '%U %a' /var/lib/formwright/data)" = 'formwright 700'
          test "$(stat -c '%U:%G %a' /etc/formwright)" = 'root:formwright 770'
          grep -q 'http://' out.txt
          grep -q '^FORMWRIGHT_SETUP_CODE=' out.txt
          ss -ltn > listen.txt; grep -q '0.0.0.0:8080' listen.txt
          grep '^FORMWRIGHT_SETUP_CODE=' out.txt | cut -d= -f2 > "$RUNNER_TEMP/code"

      - name: backup-red（AC-05 API）
        run: |
          code=$(cat "$RUNNER_TEMP/code")
          sudo chown root /var/lib/formwright/backup
          sudo chmod 0500 /var/lib/formwright/backup
          bash "$W" checks "$URL" "$code" | tee checks.json
          jq -e '.items[] | select(.key == "backupDirectory") | .ok == false' checks.json
          sudo chown formwright:formwright /var/lib/formwright/backup
          sudo chmod 0700 /var/lib/formwright/backup

      - name: wizard（AC-03、04、10）
        run: bash "$W" "$URL" "$(cat "$RUNNER_TEMP/code")" /var/lib/formwright/backup

      - name: upgrade（AC-06）
        run: |
          bash "$W" backups "$URL" > before.json
          start=$(date -u +%Y-%m-%dT%H:%M:%S)
          sudo FORMWRIGHT_PACKAGE="$P2" bash installer/linux/install.sh
          curl -fsS "$URL/api/version" > v.json; jq -e --arg v "$V2" '.version == $v' v.json
          bash "$W" verify-kept "$URL"
          bash "$W" backups "$URL" > after.json
          jq -e --arg s "$start" '[.[] | select((.trigger|tostring|ascii_downcase)=="manual" and .requestedUserId == null
            and (.status|tostring|ascii_downcase)=="succeeded" and (.queuedUtc[0:19] >= $s))] | length >= 1' after.json

      - name: upgrade-backup-fails（AC-07、D-20）
        run: |
          sudo chown root /var/lib/formwright/backup
          sudo chmod 0500 /var/lib/formwright/backup
          rc=0; sudo FORMWRIGHT_PACKAGE="$P3" bash installer/linux/install.sh > en.txt 2>&1 || rc=$?
          cat en.txt; test "$rc" = 20; grep -q 'Pre-upgrade backup failed' en.txt
          rc=0; sudo FORMWRIGHT_PACKAGE="$P3" bash installer/linux/install.sh --lang zh-TW > zh.txt 2>&1 || rc=$?
          cat zh.txt; test "$rc" = 20; grep -q '升級前備份失敗' zh.txt
          test "$(systemctl is-active formwright)" = active
          curl -fsS "$URL/api/version" > v.json; jq -e --arg v "$V2" '.version == $v' v.json
          sudo chown formwright:formwright /var/lib/formwright/backup
          sudo chmod 0700 /var/lib/formwright/backup

      - name: remove-reinstall（AC-08）
        run: |
          sudo bash installer/linux/install.sh remove
          test ! -e /etc/systemd/system/formwright.service
          test ! -e /opt/formwright
          test -e /var/lib/formwright/data
          sudo FORMWRIGHT_PACKAGE="$P2" bash installer/linux/install.sh | tee out2.txt
          if grep -q FORMWRIGHT_SETUP_CODE out2.txt; then echo "重裝不該印設定碼"; exit 1; fi
          test "$(systemctl is-enabled formwright)" = enabled
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/setup/status")" = 404
          bash "$W" verify-kept "$URL"

      - name: config-lost-existing-data（AC-13、D-16）
        run: |
          # M4：先停服務、確認已停；再以服務帳號 checkpoint（把 WAL 回填主檔），主檔必須存在且是一般檔案，只 hash 主檔。
          # -wal／-shm 是可重建的伴隨檔，唯讀開啟也可能建立它們，不納入比較；helper 內任何一步失敗都非 0（set -e，不吞錯）
          db_hash() (
            set -e
            db=/var/lib/formwright/data/formwright.db
            test "$(systemctl is-active formwright || true)" = inactive
            sudo test -f "$db"
            sudo test ! -L "$db"
            # 結果列是「busy|WAL 頁數|已回填頁數」；busy 被當成 0 結束碼回報，所以要讀結果：TRUNCATE 完成是 0|0|0
            ck=$(sudo -u formwright sqlite3 "$db" 'PRAGMA wal_checkpoint(TRUNCATE);')
            test "$ck" = "0|0|0"
            sudo test -f "$db"
            sudo sha256sum "$db" | cut -d' ' -f1
          )
          sudo systemctl stop formwright
          test "$(systemctl is-active formwright || true)" = inactive
          before=$(db_hash)
          test "${#before}" = 64
          sudo rm /etc/formwright/formwright.json
          sudo FORMWRIGHT_PACKAGE="$P2" bash installer/linux/install.sh | tee out3.txt
          code=$(grep '^FORMWRIGHT_SETUP_CODE=' out3.txt | cut -d= -f2)
          test -n "$code"
          bash "$W" checks "$URL" "$code" | tee checks.json
          jq -e '.ok == false and ([.items[] | select(.key == "database")][0] | .ok == false and .problem == "existingData"
            and .params.configFile == "/etc/formwright/formwright.json")' checks.json
          rc=0; bash "$W" complete-expect "$URL" "$code" 422 | tee complete.json || rc=$?
          test "$rc" = 0
          grep -q existingData complete.json
          sudo systemctl stop formwright
          test "$(systemctl is-active formwright || true)" = inactive
          after=$(db_hash)
          test "${#after}" = 64
          test "$before" = "$after"

      - name: purge（D-10）
        run: |
          sudo bash installer/linux/install.sh purge --yes
          test ! -e /var/lib/formwright
          test ! -e /etc/formwright
          if id formwright; then echo "使用者應已刪除"; exit 1; fi

      - name: upgrade-while-pending（Review Focus 3）
        run: |
          sudo FORMWRIGHT_PACKAGE="$P1" bash installer/linux/install.sh | tee out4.txt
          sudo cat /var/lib/formwright/data/setup-code > code-before.txt
          sudo FORMWRIGHT_PACKAGE="$P2" bash installer/linux/install.sh
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/setup/status")" = 200
          sudo cat /var/lib/formwright/data/setup-code > code-after.txt
          diff code-before.txt code-after.txt
          curl -fsS "$URL/api/version" > v.json; jq -e --arg v "$V2" '.version == $v' v.json

      - name: fresh-refuses-symlink（M1）
        run: |
          sudo bash installer/linux/install.sh purge --yes
          sudo mkdir -p /var/lib/formwright /opt/victim
          sudo chmod 0711 /opt/victim
          sudo ln -s /opt/victim /var/lib/formwright/data
          rc=0; sudo FORMWRIGHT_PACKAGE="$P1" bash installer/linux/install.sh > sym.txt 2>&1 || rc=$?
          cat sym.txt; test "$rc" != 0
          test "$(stat -c '%U %a' /opt/victim)" = 'root 711'
          sudo rm -rf /var/lib/formwright /opt/victim /etc/formwright /opt/formwright
          sudo userdel formwright || true

      - name: download-and-checksum（S1，本機 HTTP 伺服器）
        run: |
          # 先裝好 e2e.1，再用「像 Releases 的」下載路徑升級，驗各種壞下載都不動舊版
          sudo FORMWRIGHT_PACKAGE="$P1" bash installer/linux/install.sh
          srv="$RUNNER_TEMP/srv"; mkdir -p "$srv"
          cp "$P2" "$srv/"
          name="formwright-$V2-linux-x64.tar.gz"
          good=$(sha256sum "$srv/$name" | cut -d' ' -f1)
          (cd "$srv" && python3 -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          # 模擬 Releases 下載的腳本：寫入版本與來源
          sed -e "s|^FW_VERSION=.*|FW_VERSION='$V2'|" -e "s|^FW_REPO=.*|FW_REPO='o/r'|" installer/linux/install.sh > "$RUNNER_TEMP/install-rel.sh"
          run_dl() { sudo FORMWRIGHT_DOWNLOAD_BASE=http://127.0.0.1:8099 bash "$RUNNER_TEMP/install-rel.sh" "$@"; }
          still_old() { test "$(sudo cat /opt/formwright/VERSION)" = "$V1"; test "$(systemctl is-active formwright)" = active; }
          rc=0; printf '%s  %s\n' "$(printf x | sha256sum | cut -d' ' -f1)" "$name" > "$srv/SHA256SUMS"; run_dl || rc=$?; test "$rc" = 12; still_old
          rc=0; printf '%s  other.tar.gz\n' "$good" > "$srv/SHA256SUMS"; run_dl || rc=$?; test "$rc" = 12; still_old
          rc=0; rm -f "$srv/SHA256SUMS"; run_dl || rc=$?; test "$rc" = 12; still_old
          printf '%s  %s\n' "$good" "$name" > "$srv/SHA256SUMS"
          mv "$srv/$name" "$srv/hidden.tgz"
          rc=0; run_dl || rc=$?; test "$rc" = 12; still_old
          mv "$srv/hidden.tgz" "$srv/$name"
          run_dl
          test "$(sudo cat /opt/formwright/VERSION)" = "$V2"
          pkill -f 'http.server 8099' || true

      - name: 失敗時收集 journal 與設定檔
        if: failure()
        run: |
          sudo journalctl -u formwright --no-pager > journal.txt || true
          sudo cat /etc/formwright/formwright.json 2>/dev/null | sed -E 's/("ConnectionStrings"|"Dynamic")[^,}]*/\1: "<遮蔽>"/' > config-masked.json || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-${{ matrix.os }}-diagnostics
          path: |
            journal.txt
            config-masked.json
            out*.txt
            en.txt
            zh.txt
            sym.txt
          if-no-files-found: ignore

  docker:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      W: scripts/installer/e2e/wizard.sh
      URL: http://127.0.0.1:8080
      C: docker compose -f deploy/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y jq >/dev/null
      - name: 建三個映像（用 repo 的 Dockerfile）
        run: |
          i=1
          for v in "$V1" "$V2" "$V3"; do
            docker build --build-arg APP_VERSION="$v" -t "fw-e2e:$i" .
            i=$((i + 1))
          done

      - name: wizard（AC-09）
        run: |
          FORMWRIGHT_IMAGE=fw-e2e:1 $C up -d
          code=""
          for _ in $(seq 1 60); do
            code=$($C logs formwright 2>&1 | grep -oE '[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}' | head -n 1 || true)
            [ -n "$code" ] && break; sleep 2
          done
          test -n "$code"
          bash "$W" "$URL" "$code" /backup
          restarts=$(docker inspect -f '{{.RestartCount}}' "$($C ps -q formwright)")
          test "$restarts" -ge 1

      - name: upgrade（D-17、D-18）
        run: |
          bash "$W" backups "$URL" > before.json
          start=$(date -u +%Y-%m-%dT%H:%M:%S)
          FORMWRIGHT_IMAGE=fw-e2e:2 $C up -d
          for _ in $(seq 1 120); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health/ready")" = 200 ] && break; sleep 1
          done
          curl -fsS "$URL/api/version" > v.json; jq -e --arg v "$V2" '.version == $v' v.json
          bash "$W" verify-kept "$URL"
          bash "$W" backups "$URL" > after.json
          jq -e --arg s "$start" '[.[] | select((.trigger|tostring|ascii_downcase)=="manual" and .requestedUserId == null
            and (.status|tostring|ascii_downcase)=="succeeded" and (.queuedUtc[0:19] >= $s))] | length >= 1' after.json

      - name: upgrade-backup-fails（AC-12）
        run: |
          FORMWRIGHT_IMAGE=fw-e2e:3 $C -f scripts/installer/e2e/compose.backup-ro.yml up -d
          ok=0
          for _ in $(seq 1 60); do
            if [ "$(curl -s -o m.json -w '%{http_code}' "$URL/api/maintenance")" = 200 ]; then ok=1; break; fi; sleep 1
          done
          test "$ok" = 1
          jq -e --arg v "$V3" --arg p "$V2" '.reason == "preUpgradeBackupFailed" and (.errorCode | type == "string" and length > 0)
            and .version == $v and .previousVersion == $p' m.json
          for path in / /maintenance; do
            curl -s -D h.txt -o page.html "$URL$path"
            head -n 1 h.txt | grep -q ' 200'
            grep -qi '<html' page.html
          done
          js=$(curl -s "$URL/" | grep -oE '"[^"]*\.js"' | head -n 1 | tr -d '"' | sed 's|^\./|/|')
          case "$js" in /*) ;; *) js="/$js" ;; esac
          curl -s -D h.txt -o /dev/null "$URL$js"
          head -n 1 h.txt | grep -q ' 200'
          grep -qi '^content-type: .*javascript' h.txt
          curl -s -D h.txt -o me.json "$URL/api/v3/dynamic/me"
          head -n 1 h.txt | grep -q ' 503'
          jq -e '.code == "maintenance"' me.json
          # override 把 console log 改成 JSON：找 LogLevel 是 Error 且是升級前備份失敗的那一行
          $C logs --no-log-prefix formwright > logs.txt 2>&1
          grep '^{' logs.txt | jq -s -e '[.[] | select(.LogLevel == "Error" and (.Message | contains("升級前備份失敗")))] | length >= 1'
          sleep 30
          cid=$($C ps -q formwright)
          test "$(docker inspect -f '{{.State.Running}}' "$cid")" = true
          test "$(docker inspect -f '{{.RestartCount}}' "$cid")" = 0

      - name: rollback（AC-12）
        run: |
          FORMWRIGHT_IMAGE=fw-e2e:2 $C up -d
          for _ in $(seq 1 120); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health/ready")" = 200 ] && break; sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/maintenance")" = 404
          curl -fsS "$URL/api/version" > v.json; jq -e --arg v "$V2" '.version == $v' v.json
          bash "$W" verify-kept "$URL"

      - name: 失敗時收集 compose logs
        if: failure()
        run: $C logs --no-color > compose-logs.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-diagnostics
          path: compose-logs.txt
          if-no-files-found: ignore

  windows-build:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - uses: actions/download-artifact@v4
        with:
          name: e2e-wwwroot
          path: ${{ runner.temp }}/web
      - name: 發佈三個版本並編成安裝程式
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            $env:PATH += ';C:\Program Files (x86)\Inno Setup 6'
          }
          $out = Join-Path $env:RUNNER_TEMP 'setup'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($v in @($env:V1, $env:V2, $env:V3)) {
            $pub = Join-Path $env:RUNNER_TEMP "pub-$v"
            dotnet publish backend/src/DynamicModules.WebAPI/DynamicModules.WebAPI.csproj -c Release -r win-x64 --self-contained true -p:AppVersion=$v -o $pub
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish $v 失敗" }
            Remove-Item -Recurse -Force (Join-Path $pub 'wwwroot') -ErrorAction SilentlyContinue
            Copy-Item -Recurse (Join-Path $env:RUNNER_TEMP 'web\wwwroot') (Join-Path $pub 'wwwroot')
            Copy-Item -Recurse (Join-Path $env:RUNNER_TEMP 'web\sourcemaps') (Join-Path $pub 'sourcemaps')
            node scripts/installer/render-defaults.mjs --version $v
            if ($LASTEXITCODE -ne 0) { throw "render-defaults $v 失敗" }
            iscc "/DFwPublishDir=$pub" "/O$out" installer\windows\formwright.iss
            if ($LASTEXITCODE -ne 0) { throw "iscc $v 失敗" }
          }
          Get-ChildItem $out
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-windows-setup
          path: ${{ runner.temp }}/setup/*.exe
          retention-days: 3

  windows:
    needs: windows-build
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: e2e-windows-setup
          path: ${{ runner.temp }}/setup

      - name: fresh-install（AC-01、M06）
        run: |
          . ./scripts/installer/e2e/windows-lib.ps1
          Assert ((Install-Fw $env:V1 'fresh') -eq 0) '全新安裝結束碼不是 0'
          $svc = Get-Service Formwright
          Assert ($svc.StartType -eq 'Automatic') "StartType 是 $($svc.StartType)"
          Wait-Service 'Running'
          $start = (Get-CimInstance Win32_Service -Filter "Name='Formwright'").StartName
          Assert ($start -eq 'NT SERVICE\Formwright') "StartName 是 $start"
          Wait-Code "$Base/api/setup/status" 200
          $listen = Get-NetTCPConnection -LocalPort 8080 -State Listen
          Assert (@($listen | Where-Object { $_.LocalAddress -like '*0.0.0.0*' -or $_.LocalAddress -eq '::' }).Count -ge 1) '8080 沒有聽所有介面'
          # M06：規則的實際範圍，不只驗存在：只放行同網段（預設 localsubnet）與本程式，profile 不排除 Public
          $rule = Get-NetFirewallRule -DisplayName Formwright -ErrorAction Stop
          $remote = @(($rule | Get-NetFirewallAddressFilter).RemoteAddress)
          Assert (@($remote | Where-Object { $_ -ieq 'LocalSubnet' }).Count -eq $remote.Count -and $remote.Count -ge 1) "RemoteAddress 應為 LocalSubnet、實得 $($remote -join ',')"
          $program = ($rule | Get-NetFirewallApplicationFilter).Program
          Assert ($program -ieq 'C:\Program Files\Formwright\DynamicModules.WebAPI.exe') "Program 不對：$program"
          Assert ("$($rule.Profile)" -eq 'Any') "Profile 應為 Any、實得 $($rule.Profile)"
          $r = Invoke-WebRequest "$Base/" -UseBasicParsing
          Assert ($r.StatusCode -eq 200 -and "$($r.Headers['Content-Type'])" -match 'text/html') 'GET / 不是 HTML'
          Assert ((Setup-Code).Length -ge 12) '設定碼檔內容不對'
          # B03：wwwroot 沒有 source map
          Assert (@(Get-ChildItem 'C:\Program Files\Formwright\wwwroot' -Recurse -Filter '*.map').Count -eq 0) 'wwwroot 不該有 source map'

      - name: acl（TD-04、B01、M02）
        run: |
          . ./scripts/installer/e2e/windows-lib.ps1
          icacls 'C:\ProgramData\Formwright' | Write-Host
          Assert-AclState
          Assert-ParentSddl   # fresh：父目錄是一次建立的最終 DACL，回讀的 SDDL 與預期一致
          # 失敗注入案例用算出來的服務 SID 預先放父目錄（New-LockedData）：必須和服務實際的 SID 一致
          $realSid = (New-Object Security.Principal.NTAccount('NT SERVICE\Formwright')).Translate([Security.Principal.SecurityIdentifier]).Value
          Assert ((Get-ServiceSid) -ceq $realSid) "算出的服務 SID $(Get-ServiceSid) 與實際 $realSid 不同"
          Assert (Test-Path "$Data\setup-code") 'setup-code 不在'

      - name: backup-red（AC-05）
        run: |
          . ./scripts/installer/e2e/windows-lib.ps1
          Icacls $Backup /deny 'NT SERVICE\Formwright:(OI)(CI)W'
          try {
            $j = (Wiz checks $Base (Setup-Code)) | ConvertFrom-Json
            $item = $j.items | Where-Object { $_.key -eq 'backupDirectory' }
            Assert ($null -ne $item -and $item.ok -eq $false) 'backupDirectory 應為紅燈'
          } finally { Icacls $Backup /remove:d 'NT SERVICE\Formwright'; Icacls $Backup /reset /C /L }   # icacls 改 DACL 時把繼承 ACE 複製成明確 ACE，/reset 才回到只繼承

      - name: wizard 與 setup-complete-restarts-service（AC-03、10、04、Review Focus 1、B02）
        run: |
          . ./scripts/installer/e2e/windows-lib.ps1
          # wizard.ps1 以 complete 回應時刻起算 60 秒，站台回一般模式與服務回 Running 共用同一個截止時間
          $env:FW_E2E_SERVICE = 'Formwright'
          try {
            Wiz $Base (Setup-Code) $Backup
            Wiz verify-kept $Base
          } catch {
            sc.exe qfailure Formwright; sc.exe qfailureflag Formwright
            throw
          }
          # 精靈完成後：父目錄仍是完整預期集合；服務自己建的金鑰等檔案可由服務帳號擁有
          Assert-AclState -AllowServiceOwner

      - name: upgrade（AC-06、M02、M05、M06）
        run: |
          . ./scripts/installer/e2e/windows-lib.ps1
          # 備份差集的起點要在被拒絕的那次升級之前取（拒絕之後服務是停用的，API 不通）；被拒絕那次自己的備份由 $start 排除
          $before = @((Wiz backups $Base) | ConvertFrom-Json)
          $beforeIds = @($before | ForEach-Object { [long]$_.id })
          # M02：升級只驗證、不重設。資料目錄由一般使用者擁有 → 安裝程式必須拒絕（結束碼 20、log 有 untrusted owner、服務停用）；改回後再升級必須成功
          Icacls $Data /setowner 'BUILTIN\Users'
          $rc = Install-Fw $env:V2 'upgrade-untrusted-owner'
          Assert ($rc -eq 20) "資料目錄擁有者是 Users 時結束碼應為 20、實得 $rc"
          Assert ((Log-Text 'setup-upgrade-untrusted-owner.log') -match 'untrusted owner') 'log 缺「untrusted owner」'
          $s = Get-Service Formwright
          Assert ($s.StartType -eq 'Disabled' -and $s.Status -eq 'Stopped') "預檢拒絕後服務應為 Disabled／Stopped、實得 $($s.StartType)／$($s.Status)"
          Icacls $Data /setowner '*S-1-5-32-544'
          Assert-AclState -AllowServiceOwner   # 改回擁有者後樹要回到預期集合，下一段的拒絕才確定是讀取授權造成的
          # M02：系統管理員自己加的讀取授權（沒有寫入權）也算偏差，升級必須拒絕：結束碼 20、log 有規則與路徑、服務停用、授權原封不動（沒有任何寫入）
          $cfg = 'C:\ProgramData\Formwright\formwright.json'
          Icacls $Data /grant 'BUILTIN\Users:(OI)(CI)R'
          Icacls $cfg /grant 'BUILTIN\Users:R'
          $dataSddl = (Get-Acl -LiteralPath $Data).Sddl
          $cfgSddl = (Get-Acl -LiteralPath $cfg).Sddl
          $rc = Install-Fw $env:V2 'upgrade-read-grant'
          Assert ($rc -eq 20) "既有的 Users 讀取授權時結束碼應為 20、實得 $rc"
          $log = Log-Text 'setup-upgrade-read-grant.log'
          Assert ($log -match 'unexpected ACE for S-1-5-32-545') 'log 缺「unexpected ACE for S-1-5-32-545」（規則）'
          Assert ($log -match [regex]::Escape('C:\ProgramData\Formwright')) 'log 缺資料目錄路徑'
          $s = Get-Service Formwright
          Assert ($s.StartType -eq 'Disabled' -and $s.Status -eq 'Stopped') "讀取授權被拒絕後服務應為 Disabled／Stopped、實得 $($s.StartType)／$($s.Status)"
          Assert ((Get-Acl -LiteralPath $Data).Sddl -ceq $dataSddl) '被拒絕的升級改動了資料目錄的 ACL'
          Assert ((Get-Acl -LiteralPath $cfg).Sddl -ceq $cfgSddl) '被拒絕的升級改動了設定檔的 ACL'
          Assert (@((Get-Acl -LiteralPath $Data).Access | Where-Object { $_.IdentityReference.Value -like '*\Users' -and -not $_.IsInherited }).Count -ge 1) '資料目錄上的 Users 讀取授權不見了'
          # 管理員手動移除授權（/reset 回到純繼承）後再升級必須成功
          Icacls $Data /reset /T /C /L
          Icacls $cfg /reset /C /L
          Assert-AclState -AllowServiceOwner
          # M06 回歸：先手動放一條舊版留下的寬規則（只有 port、不限來源與程式），不帶參數升級後必須被收斂成一條受限的規則
          New-NetFirewallRule -DisplayName Formwright -Direction Inbound -Action Allow -Protocol TCP -LocalPort 8080 | Out-Null
          $start = Now-Utc
          Assert ((Install-Fw $env:V2 'upgrade') -eq 0) '升級結束碼不是 0'
          Version-Is $env:V2
          Wiz verify-kept $Base | Out-Null
          Assert-AclState -AllowServiceOwner
          $rules = @(Get-NetFirewallRule -DisplayName Formwright)
          Assert ($rules.Count -eq 1) "升級後防火牆規則應剛好一條、實得 $($rules.Count)"
          $remote = @(($rules[0] | Get-NetFirewallAddressFilter).RemoteAddress)
          Assert (@($remote | Where-Object { $_ -ieq 'LocalSubnet' }).Count -eq $remote.Count -and $remote.Count -ge 1) "升級後 RemoteAddress 應為 LocalSubnet、實得 $($remote -join ',')"
          Assert ((($rules[0] | Get-NetFirewallApplicationFilter).Program) -ieq 'C:\Program Files\Formwright\DynamicModules.WebAPI.exe') '升級後規則沒有限定程式'
          # 備份：升級前後的 run id 差集裡要有新的成功 Manual 備份，且時間不早於起點（不靠同秒的舊備份）
          $runs = @((Wiz backups $Base) | ConvertFrom-Json)
          $new = @($runs | Where-Object { $beforeIds -notcontains [long]$_.id })
          $hit = @($new | Where-Object {
            "$($_.trigger)".ToLower() -eq 'manual' -and $null -eq $_.requestedUserId -and "$($_.status)".ToLower() -eq 'succeeded' -and
            (To-UtcOffset $_.queuedUnix) -ge $start })
          Assert ($hit.Count -ge 1) "升級後沒有新的成功 Manual 備份（起點 $($start.ToString('o'))、新增 $($new.Count) 筆）"

      - name: upgrade-backup-fails（AC-07、D-20）
        run: |
          . ./scripts/installer/e2e/windows-lib.ps1
          # 升級前備份由安裝程式以系統管理員身分跑，所以對 Everyone deny 寫入（deny 對 Administrators 也生效）
          Icacls $Backup /deny '*S-1-1-0:(OI)(CI)(W,AD,WD)'
          try {
            $rc = Install-Fw $env:V3 'backup-fails-en'
            Assert ($rc -ne 0) '備份失敗時安裝程式結束碼應非 0'
            Assert ((Log-Text 'setup-backup-fails-en.log') -match 'Pre-upgrade backup failed') '英文 log 缺「Pre-upgrade backup failed」'
            $rc = Install-Fw $env:V3 'backup-fails-zh' @('/LANG=chinesetraditional')
            Assert ($rc -ne 0) '備份失敗時（繁中）安裝程式結束碼應非 0'
            Assert ((Log-Text 'setup-backup-fails-zh.log') -match '升級前備份失敗') '繁中 log 缺「升級前備份失敗」'
            # 舊版必須被拉回來：自動啟動、執行中、就緒（版號還是 V2）
            Wait-Service 'Running'
            Assert ((Get-Service Formwright).StartType -eq 'Automatic') '備份失敗後服務啟動類型應恢復成 Automatic'
            Version-Is $env:V2
          } finally { Icacls $Backup /remove:d '*S-1-1-0'; Icacls $Backup /reset /C /L }   # icacls 改 DACL 時把繼承 ACE 複製成明確 ACE，/reset 才回到只繼承

      - name: crash-window-upgrade（M03：服務剛崩潰、SCM 已排程重啟時升級）
        run: |
          . ./scripts/installer/e2e/windows-lib.ps1
          # 殺掉程序：失敗復原會在 5 秒後排程重啟；馬上升級，安裝程式必須先停用服務擋住那次重啟
          Stop-Process -Name 'DynamicModules.WebAPI' -Force
          $rc = Install-Fw $env:V2 'crash-window'
          Assert ($rc -eq 0) "崩潰視窗內升級結束碼應為 0、實得 $rc"
          Assert ((Log-Text 'setup-crash-window.log') -match 'config Formwright start= disabled -> 0') 'log 缺「先停用服務」'
          Wait-Service 'Running'
          Assert ((Get-Service Formwright).StartType -eq 'Automatic') '升級後服務啟動類型應為 Automatic'
          Version-Is $env:V2
          Wiz verify-kept $Base | Out-Null

      - name: remove-reinstall（AC-08）與 reinstall-without-backup（M06 reinstall 重建規則）
        run: |
          . ./scripts/installer/e2e/windows-lib.ps1
          Assert ((Uninstall-Fw 'keep') -eq 0) '移除結束碼不是 0'
          Assert ($null -eq (Get-Service Formwright -ErrorAction SilentlyContinue)) '移除後服務還在'
          Assert (Test-Path $Data) '移除後資料不見了'
          Assert ($null -eq (Get-NetFirewallRule -DisplayName Formwright -ErrorAction SilentlyContinue)) '移除後防火牆規則還在'
          # 重裝帶 /FIREWALLSCOPE：規則要用這個範圍重建
          Assert ((Install-Fw $env:V2 'reinstall' @('/FIREWALLSCOPE=192.0.2.0/24,198.51.100.0/24')) -eq 0) '重裝結束碼不是 0'
          Assert ((Log-Text 'setup-reinstall.log') -notmatch 'backup-now') 'reinstall 不該呼叫 --backup-now'
          Version-Is $env:V2
          $rule = Get-NetFirewallRule -DisplayName Formwright -ErrorAction Stop
          $remote = @(($rule | Get-NetFirewallAddressFilter).RemoteAddress)
          Assert (@($remote | Where-Object { $_ -like '192.0.2.0/*' }).Count -ge 1 -and @($remote | Where-Object { $_ -like '198.51.100.0/*' }).Count -ge 1) "RemoteAddress 沒有照 /FIREWALLSCOPE：$($remote -join ',')"
          Assert ((Http-Code "$Base/api/setup/status") -eq 404) '重裝後不該有精靈'
          Wiz verify-kept $Base | Out-Null
          # M06：不帶 /FIREWALLSCOPE 再安裝一次（升級），要沿用上次的範圍（RegisterPreviousData），不退回預設
          Assert ((Install-Fw $env:V2 'rerun-keeps-scope') -eq 0) '再次安裝結束碼不是 0'
          $remote = @(((Get-NetFirewallRule -DisplayName Formwright -ErrorAction Stop) | Get-NetFirewallAddressFilter).RemoteAddress)
          Assert (@($remote | Where-Object { $_ -like '192.0.2.0/*' }).Count -ge 1 -and @($remote | Where-Object { $_ -like '198.51.100.0/*' }).Count -ge 1) "升級沒有沿用上次的範圍：$($remote -join ',')"
          Version-Is $env:V2

      - name: config-lost-existing-data（AC-13、D-16）
        run: |
          . ./scripts/installer/e2e/windows-lib.ps1
          # 先停服務、確認已停；以 sqlite3 checkpoint 後只 hash 主檔（見 windows-lib.ps1 的 Db-Hash，任何一步失敗都 throw）
          if (-not (Get-Command sqlite3 -ErrorAction SilentlyContinue)) {
            choco install sqlite --no-progress -y
            $env:PATH += ';C:\ProgramData\chocolatey\bin'
          }
          Stop-Service Formwright; Wait-Service 'Stopped'
          $before = Db-Hash
          Assert ($before.Length -eq 64) '基準 hash 長度不是 64'
          Remove-Item 'C:\ProgramData\Formwright\formwright.json'
          Assert ((Install-Fw $env:V2 'config-lost') -eq 0) '設定檔遺失後重裝結束碼不是 0'
          $code = Setup-Code
          Assert ($code.Length -ge 12) '沒有新的設定碼'
          $j = (Wiz checks $Base $code) | ConvertFrom-Json
          $db = $j.items | Where-Object { $_.key -eq 'database' }
          Assert ($j.ok -eq $false -and $db.ok -eq $false -and $db.problem -eq 'existingData') 'database 應為 existingData 紅燈'
          $o = Wiz complete-expect $Base $code 422
          Assert ($o -match 'existingData') 'complete 的 422 應含 existingData'
          Stop-Service Formwright; Wait-Service 'Stopped'
          $after = Db-Hash
          Assert ($after.Length -eq 64) '比對 hash 長度不是 64'
          Assert ($before -ceq $after) '資料庫檔的 hash 變了'

      - name: remove-delete-data（D-10）
        run: |
          . ./scripts/installer/e2e/windows-lib.ps1
          Assert ((Uninstall-Fw 'delete' @('/DELETEDATA')) -eq 0) '移除結束碼不是 0'
          Assert (-not (Test-Path 'C:\ProgramData\Formwright')) '/DELETEDATA 後資料目錄還在'

      - name: failure-injection（M04、M02、N01）
        run: |
          . ./scripts/installer/e2e/windows-lib.ps1
          # 每個案例結束都驗：服務不存在、沒有殘留程序、資料目錄不在、防火牆規則不在
          function Cleanup([string]$Name) {
            Quiesce-Fw
            Assert ((Uninstall-Fw $Name @('/DELETEDATA')) -eq 0) '清理（移除）結束碼不是 0'
            Assert-FwGone
          }
          # 1) 連接埠被占用：服務起不來。安裝程式必須以 20 結束、服務維持停用並停止（不會無限重啟）、log 有失敗步驟
          $l = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Any, 8080)
          $l.Start()
          try {
            try {
              $rc = Install-Fw $env:V1 'inject-port'
              Assert ($rc -eq 20) "服務起不來時結束碼應為 20、實得 $rc"
              Assert ((Log-Text 'setup-inject-port.log') -match 'Setup did not complete: service readiness') 'log 缺「service readiness」失敗'
              $s = Get-Service Formwright
              Assert ($s.StartType -eq 'Disabled' -and $s.Status -eq 'Stopped') "失敗後服務應為 Disabled／Stopped、實得 $($s.StartType)／$($s.Status)"
            } finally {
              Quiesce-Fw   # 先確保服務停用並停止，再釋放故障條件
              $l.Stop()
            }
          } finally { Cleanup 'inject-port' }
          # 1b) 另一個程序占著埠，還回「同版號的 /api/version」與「setup 200」：就緒檢查必須綁本次服務程序，不能被它騙過，安裝程式必須以 20 結束
          $fake = Join-Path $env:RUNNER_TEMP 'fake-site.ps1'
          Set-Content -Path $fake -Value @'
          param([string]$Ver)
          $l = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Any, 8080)
          $l.Start()
          while ($true) {
            $c = $l.AcceptTcpClient()
            try {
              $st = $c.GetStream()
              $buf = New-Object byte[] 4096
              $n = $st.Read($buf, 0, $buf.Length)
              $req = [Text.Encoding]::ASCII.GetString($buf, 0, $n)
              $body = if ($req -match 'GET /api/version') { '{"version":"' + $Ver + '"}' } else { '{}' }
              $out = [Text.Encoding]::ASCII.GetBytes("HTTP/1.1 200 OK`r`nContent-Type: application/json`r`nContent-Length: $($body.Length)`r`nConnection: close`r`n`r`n$body")
              $st.Write($out, 0, $out.Length)
            } catch { } finally { $c.Close() }
          }
          '@
          $fp = Start-Process pwsh -ArgumentList @('-NoProfile', '-File', $fake, $env:V1) -PassThru -WindowStyle Hidden
          try {
            try {
              Wait-Code "$Base/api/version" 200 30
              $rc = Install-Fw $env:V1 'inject-fakesite'
              Assert ($rc -eq 20) "別的程序假冒就緒時結束碼應為 20、實得 $rc"
              Assert ((Log-Text 'setup-inject-fakesite.log') -match 'Setup did not complete: service readiness') 'log 缺「service readiness」失敗'
              $s = Get-Service Formwright
              Assert ($s.StartType -eq 'Disabled' -and $s.Status -eq 'Stopped') "失敗後服務應為 Disabled／Stopped、實得 $($s.StartType)／$($s.Status)"
            } finally {
              Quiesce-Fw
              Stop-Process -Id $fp.Id -Force -ErrorAction SilentlyContinue
            }
          } finally { Cleanup 'inject-fakesite' }
          # 2) 資料目錄裡有 junction：安裝程式必須拒絕（不跟隨），以 20 結束；目標的內容與權限不能變
          $target = Join-Path $env:RUNNER_TEMP 'junction-target'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Set-Content -Path "$target\sentinel.txt" -Value 'sentinel'
          $aclBefore = (Get-Acl -LiteralPath $target).Sddl
          $sentinelBefore = (Get-Acl -LiteralPath "$target\sentinel.txt").Sddl
          New-LockedData   # 父目錄先鎖成只有 SYSTEM／Administrators，預檢才會在 junction 上停下，而不是先被 ProgramData 繼承的 Users 權限擋掉
          try {
            New-Item -ItemType Junction -Path "$Data\evil" -Target $target | Out-Null
            try {
              $rc = Install-Fw $env:V1 'inject-junction'
              Assert ($rc -eq 20) "junction 時結束碼應為 20、實得 $rc"
              Assert ((Log-Text 'setup-inject-junction.log') -match 'reparse point') 'log 缺「reparse point」'
              $s = Get-Service Formwright -ErrorAction SilentlyContinue
              Assert ($null -ne $s -and $s.StartType -eq 'Disabled' -and $s.Status -eq 'Stopped') 'junction 失敗後服務應為 Disabled／Stopped'
              Assert ((Get-Content "$target\sentinel.txt") -eq 'sentinel') 'junction 目標的哨兵檔內容變了'
              Assert ((Get-Acl -LiteralPath $target).Sddl -ceq $aclBefore) 'junction 目標目錄的 ACL 變了'
              Assert ((Get-Acl -LiteralPath "$target\sentinel.txt").Sddl -ceq $sentinelBefore) 'junction 目標檔案的 ACL 變了'
            } finally {
              Quiesce-Fw
              if (Test-Path -LiteralPath "$Data\evil") { [IO.Directory]::Delete("$Data\evil") }   # 只刪連結，不動目標
            }
          } finally {
            try { Cleanup 'inject-junction' } finally { Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue }
          }

          # 3) 資料目錄裡有指向樹外檔案的 hardlink：預檢必須拒絕（結束碼 20、log 有 hard link），樹外檔案的擁有者與 ACL 不能變
          #    樹外哨兵放在 C: 磁碟（hardlink 不能跨磁碟；RUNNER_TEMP 在 D:）
          $hl = 'C:\fw-e2e-hardlink'
          New-Item -ItemType Directory -Force -Path $hl | Out-Null
          Set-Content -Path "$hl\sentinel.txt" -Value 'sentinel'
          # 哨兵本身的 ACL 要可信（只有 SYSTEM、Administrators），才會走到「硬連結數」那條規則；C:\ 預設給 Authenticated Users 寫入
          Icacls "$hl\sentinel.txt" /inheritance:r /grant:r '*S-1-5-18:F' '*S-1-5-32-544:F'
          $hlBefore = (Get-Acl -LiteralPath "$hl\sentinel.txt").Sddl
          New-LockedData
          try {
            New-Item -ItemType HardLink -Path "$Data\linked.txt" -Target "$hl\sentinel.txt" | Out-Null
            try {
              $rc = Install-Fw $env:V1 'inject-hardlink'
              Assert ($rc -eq 20) "hardlink 時結束碼應為 20、實得 $rc"
              Assert ((Log-Text 'setup-inject-hardlink.log') -match 'hard link') 'log 缺「hard link」'
              $s = Get-Service Formwright -ErrorAction SilentlyContinue
              Assert ($null -ne $s -and $s.StartType -eq 'Disabled' -and $s.Status -eq 'Stopped') 'hardlink 失敗後服務應為 Disabled／Stopped'
              Assert ((Get-Content "$hl\sentinel.txt") -eq 'sentinel') 'hardlink 哨兵檔內容變了'
              Assert ((Get-Acl -LiteralPath "$hl\sentinel.txt").Sddl -ceq $hlBefore) 'hardlink 哨兵檔的擁有者或 ACL 變了'
            } finally {
              Quiesce-Fw
              if (Test-Path -LiteralPath "$Data\linked.txt") { Remove-Item -LiteralPath "$Data\linked.txt" -Force }
            }
          } finally {
            try { Cleanup 'inject-hardlink' } finally { Remove-Item -LiteralPath $hl -Recurse -Force -ErrorAction SilentlyContinue }
          }
          # 4) 資料目錄的子目錄被加上 Users 寫入（Modify）：預檢必須拒絕（結束碼 20、log 有 untrusted write ACE），外部不動；清掉該授權後同一個安裝程式必須成功
          $ext = 'C:\fw-e2e-external'
          New-Item -ItemType Directory -Force -Path $ext | Out-Null
          Set-Content -Path "$ext\sentinel.txt" -Value 'sentinel'
          $extBefore = (Get-Acl -LiteralPath $ext).Sddl
          $extFileBefore = (Get-Acl -LiteralPath "$ext\sentinel.txt").Sddl
          New-LockedData
          try {
            New-Item -ItemType Directory -Force -Path "$Data\sub" | Out-Null
            Icacls "$Data\sub" /grant 'BUILTIN\Users:(OI)(CI)M'
            try {
              $rc = Install-Fw $env:V1 'inject-userwrite'
              Assert ($rc -eq 20) "子目錄有 Users 寫入時結束碼應為 20、實得 $rc"
              Assert ((Log-Text 'setup-inject-userwrite.log') -match 'untrusted write ACE') 'log 缺「untrusted write ACE」'
              $s = Get-Service Formwright -ErrorAction SilentlyContinue
              Assert ($null -ne $s -and $s.StartType -eq 'Disabled' -and $s.Status -eq 'Stopped') '預檢拒絕後服務應為 Disabled／Stopped'
              Assert ((Get-Acl -LiteralPath $ext).Sddl -ceq $extBefore -and (Get-Acl -LiteralPath "$ext\sentinel.txt").Sddl -ceq $extFileBefore) '外部目錄或檔案的 ACL 變了'
              Icacls "$Data\sub" /remove 'BUILTIN\Users'
              Icacls "$Data\sub" /reset /C /L   # icacls 改 DACL 後要 /reset 才回到純繼承（升級只驗證不重設，不會替它收拾）
              Quiesce-Fw
              Assert ((Install-Fw $env:V1 'inject-userwrite-fixed') -eq 0) '清掉 Users 寫入後安裝應成功'
              Wait-Code "$Base/api/version" 200
              Assert (((Invoke-RestMethod "$Base/api/version").version) -ceq $env:V1) '清掉後安裝的版本不對'
              Assert-AclState -AllowServiceOwner
            } finally { Quiesce-Fw }
          } finally {
            try { Cleanup 'inject-userwrite' } finally { Remove-Item -LiteralPath $ext -Recurse -Force -ErrorAction SilentlyContinue }
          }

          # 5) 資料父目錄的直接上層（ProgramData）有別人可刪除／改名它的授權：預檢必須拒絕（結束碼 20、log 有 untrusted ancestor、父目錄不被建立）；清掉後同一個安裝程式必須成功
          #    用暫時的本機群組當非受信主體（對 Users 加了 DELETE_CHILD 再移除，會一併清掉 ProgramData 預設給 Users 的授權）
          $grp = 'fwe2eDc'
          & net.exe localgroup $grp /add | Out-Null
          Assert ($LASTEXITCODE -eq 0) '建立暫時群組失敗'
          try {
            Icacls 'C:\ProgramData' /grant "${grp}:(DC)"   # 只套用本物件的 DELETE_CHILD
            try {
              $rc = Install-Fw $env:V1 'inject-ancestor'
              Assert ($rc -eq 20) "ProgramData 有 DELETE_CHILD 授權時結束碼應為 20、實得 $rc"
              Assert ((Log-Text 'setup-inject-ancestor.log') -match 'untrusted ancestor') 'log 缺「untrusted ancestor」'
              $s = Get-Service Formwright -ErrorAction SilentlyContinue
              Assert ($null -ne $s -and $s.StartType -eq 'Disabled' -and $s.Status -eq 'Stopped') '預檢拒絕後服務應為 Disabled／Stopped'
              Assert (-not (Test-Path 'C:\ProgramData\Formwright')) '被拒絕時資料父目錄不該被建立'
              Icacls 'C:\ProgramData' /remove:g $grp
              Quiesce-Fw
              Assert ((Install-Fw $env:V1 'inject-ancestor-fixed') -eq 0) '清掉授權後安裝應成功'
              Wait-Code "$Base/api/version" 200
              Assert (((Invoke-RestMethod "$Base/api/version").version) -ceq $env:V1) '清掉後安裝的版本不對'
              Assert-AclState -AllowServiceOwner
              Assert-ParentSddl
            } finally { Quiesce-Fw }
          } finally {
            & "$env:SystemRoot\System32\icacls.exe" 'C:\ProgramData' /remove:g $grp | Out-Null
            & net.exe localgroup $grp /delete | Out-Null
            Cleanup 'inject-ancestor'
          }
          # 斷言失敗都會 throw；清場中的原生命令（sc、icacls、net 對已不存在的對象）可能留下非 0 的 LASTEXITCODE，GitHub 的 pwsh 包裝會拿它當步驟結果
          $global:LASTEXITCODE = 0

      - name: 失敗時收集事件記錄與服務狀態
        if: failure()
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'logs'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Get-WinEvent -LogName Application -MaxEvents 500 | Format-List TimeCreated, ProviderName, Id, Message | Out-File -Encoding utf8 "$d\events.txt"
          sc.exe query Formwright *> "$d\sc-query.txt"
          sc.exe qfailure Formwright *> "$d\sc-qfailure.txt"
          sc.exe qfailureflag Formwright *> "$d\sc-qfailureflag.txt"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-diagnostics
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore
